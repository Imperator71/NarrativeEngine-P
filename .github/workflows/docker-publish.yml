name: Build and Publish Docker image

on:
  workflow_dispatch:
  push:
    branches: [main, server-auth]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/narrativeengine-p

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The app's own version as an immutable tag: a moving branch tag cannot tell
      # a running container which build it holds, nor be pinned in a compose file.
      - id: pkg
        run: |
          node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # Branch pushes also publish `:server-auth`, which is what the
            # parallel TrueNAS deployment pulls.
            type=ref,event=branch
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache: an app-only change re-uses the
          # dependency layers instead of rebuilding them, which keeps the pushed
          # delta small — the old workflow rebuilt everything on every push.
          # `scope` is part of the cache key: bump it to abandon a cache that has
          # gone bad (a poisoned npm cache makes every build fail at `npm ci`).
          cache-from: type=gha,scope=ne-build-v2
          cache-to: type=gha,mode=max,scope=ne-build-v2

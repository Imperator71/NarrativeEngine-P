name: Build and Publish Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/narrativeengine-p

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            cat > Dockerfile <<'EOF'
            FROM node:22-bookworm-slim
            WORKDIR /app

            RUN apt-get update \
              && apt-get install -y --no-install-recommends python3 make g++ \
              && rm -rf /var/lib/apt/lists/*

            COPY package.json package-lock.json ./
            COPY packages/engine/package.json packages/engine/package-lock.json ./packages/engine/

            RUN npm ci
            RUN npm ci --prefix packages/engine

            COPY . .
            RUN npm run build --prefix packages/engine

            RUN mkdir -p /app/data /app/mods /app/public/assets/portraits

            ENV HOST=0.0.0.0
            EXPOSE 5173 3001

            VOLUME ["/app/data", "/app/mods", "/app/public/assets/portraits"]

            CMD ["npm", "run", "dev"]
            EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
